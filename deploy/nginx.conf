# BSM Mekanik — nginx sunucu ayarı
# Kurulum: bu dosyayı /etc/nginx/sites-available/bsmmekanik olarak kopyalayın,
#   ln -s /etc/nginx/sites-available/bsmmekanik /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d bsmmekanik.nesakyazilim.com            (önce demo)
#   certbot --nginx -d www.bsmmekanik.com -d bsmmekanik.com -d www.bsmmechanical.com -d bsmmechanical.com
#                                                               (alan adları sunucuya yönlendikten sonra)
# Site dosyaları: depodaki public/ klasörünün içeriği → /var/www/bsmmekanik

server {
    listen 80;
    listen [::]:80;
    server_name bsmmekanik.nesakyazilim.com
                www.bsmmekanik.com bsmmekanik.com
                www.bsmmechanical.com bsmmechanical.com;

    root /var/www/bsmmekanik;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    # Çıplak alan adları www'ye
    if ($host = bsmmekanik.com)    { return 301 https://www.bsmmekanik.com$request_uri; }
    if ($host = bsmmechanical.com) { return 301 https://www.bsmmechanical.com$request_uri; }

    # Demo adresi arama motorlarına kapalı (asıl adresler www.bsmmekanik.com / www.bsmmechanical.com)
    set $robots "";
    if ($host = bsmmekanik.nesakyazilim.com) { set $robots "noindex"; }

    add_header X-Robots-Tag $robots always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Eski / alternatif adresler
    location = /en/references { return 301 /en/projects; }
    location = /en { return 301 /en/; }
    location ~ ^/(.*/)?index\.html$ { return 301 /$1; }
    location ~ ^/(.+)\.html$ { return 301 /$1; }

    # Temiz adresler: /kurumsal → kurumsal.html, /en/ → en/index.html
    # ($uri/index.html doğrudan sunulur; index yönergesine bırakılırsa
    #  /index.html → / yönlendirmesiyle döngüye girer)
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Önbellek: CSS/JS adresleri içerik özetli (?v=...) olduğu için uzun süre
    location ^~ /assets/css/   { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff; add_header X-Robots-Tag $robots; }
    location ^~ /assets/js/    { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff; add_header X-Robots-Tag $robots; }
    location ^~ /assets/fonts/ { expires 1y; add_header Cache-Control "public, immutable"; add_header Access-Control-Allow-Origin "*"; }
    location ^~ /assets/img/   { expires 1d; add_header X-Robots-Tag $robots; }
    location ^~ /assets/video/ { expires 1d; }

    # Cloudflare'a özel dosyalar sunulmaz
    location ~ ^/_(headers|redirects)$ { return 404; }
}
